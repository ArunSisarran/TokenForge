# Defaults run on kind with the llm-d inference simulator as the engine (no GPU).

gateway:
  image: tokenforge-gateway:dev   # built locally, then `kind load docker-image`
  replicas: 2                     # two processes share rate limits through Redis
  nodePort: 30080                 # deploy/kind.yaml maps it to localhost:8080
  resources:
    requests: {cpu: 250m, memory: 128Mi}
    limits: {memory: 256Mi}

redis:
  image: redis:8.12.0-alpine
  storage: 1Gi

engine:
  # simulator: the llm-d inference simulator runs inside the cluster.
  # external:  real vLLM outside the cluster (a RunPod pod), reached at external.ip:port.
  mode: simulator
  apiKey: ""                      # the gateway sends it to the engine; required for external
  simulator:
    image: ghcr.io/llm-d/llm-d-inference-sim:v1.2.0
    # INT4 L4 timings from Phases 1-2; startup-duration stands in for vLLM's model load.
    args: [--model, qwen3-8b, --time-to-first-token, 80ms, --inter-token-latency, 21ms,
           --max-num-seqs, "64", --max-model-len, "4096", --startup-duration, 60s]
    resources:
      requests: {cpu: 250m, memory: 128Mi}
      limits: {memory: 512Mi}
  external:
    ip: ""
    port: 8000
