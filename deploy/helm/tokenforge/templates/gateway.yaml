apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        # Env vars from a Secret are read only at pod start: roll the pods when the key changes.
        checksum/engine-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: UPSTREAM_URL, value: "http://{{ .Release.Name }}-engine:8000"}
            - {name: REDIS_URL, value: "redis://{{ .Release.Name }}-redis:6379"}
            - name: UPSTREAM_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-engine, key: apiKey}}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: {{ .Values.gateway.nodePort }}}]
