# A StatefulSet, not a Deployment: its pod keeps the same volume (and API keys) across restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  serviceName: {{ .Release.Name }}-redis
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # the image's redis user
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 10}
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.redis.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  selector: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
# Redis has no password: only gateway pods may connect to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-redis
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
      ports: [{port: redis}]
