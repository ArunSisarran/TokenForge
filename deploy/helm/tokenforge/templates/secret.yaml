{{- if and (eq .Values.engine.mode "external") (not .Values.engine.apiKey) }}
{{- fail "engine.apiKey is required for an external engine: it is reachable from the internet" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-engine
  labels: {app.kubernetes.io/name: engine, app.kubernetes.io/instance: {{ .Release.Name }}}
type: Opaque
stringData:
  apiKey: {{ .Values.engine.apiKey | quote }}
